<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AgentRelay · 远程 AI 任务伴侣 (React)</title>
  <link rel="stylesheet" href="./styles.css">
  
  <!-- 本地优先的 React 18 / ReactDOM / Babel Standalone 运行时 (离线与内网免依赖极速加载) -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <!-- CDN 双重降级容灾兜底 -->
  <script>
    if (!window.React) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    }
    if (!window.ReactDOM) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
    if (!window.Babel) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="root">
    <!-- 极速首屏 Loading 占位，React 加载后自动接管 -->
    <div class="container">
      <div class="card" style="padding: 24px; text-align: center;">
        <div class="spinner" style="margin: 0 auto 12px auto;"></div>
        <div style="font-size: 14px; color: #8b949e;">正在载入 AgentRelay (React)...</div>
      </div>
    </div>
  </div>

  <!-- React TypeScript 入口模块 -->
  <script type="text/babel" data-type="module" data-presets="react,typescript" src="./index.tsx"></script>
</body>
</html>
