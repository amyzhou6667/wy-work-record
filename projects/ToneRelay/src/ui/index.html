<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ToneRelay - 智能影调迁移伴侣</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 微信环境专属引导横幅 -->
    <div class="wx-tip-banner" id="wxBanner" style="display: none;">
      💡 微信提示：若在微信内选图受限，可点击右上角【...】选择【在浏览器打开】体验更顺畅。
    </div>

    <header class="app-header">
      <div class="logo-title">
        <span class="logo-icon">🎨</span>
        <h1>ToneRelay</h1>
      </div>
      <p class="subtitle">解构灵感色调 · 批量无损应用</p>
    </header>

    <!-- 1. 双槽选图区 (使用标准 HTML label 关联，100% 杜绝微信/安卓覆盖层防欺诈崩溃) -->
    <section class="slot-section">
      <label class="slot-card" for="refInput" id="refCard">
        <div class="slot-badge">灵感参考图</div>
        <div class="slot-preview" id="refPreview">
          <span class="upload-tip">+ 从相册选择参考图</span>
        </div>
      </label>
      <input type="file" id="refInput" accept="image/jpeg,image/png,image/jpg,image/webp" class="visually-hidden-input">

      <label class="slot-card" for="targetInput" id="targetCard">
        <div class="slot-badge">待修原图 (1~9张)</div>
        <div class="slot-preview" id="targetPreview">
          <span class="upload-tip">+ 从相册选择照片</span>
        </div>
      </label>
      <input type="file" id="targetInput" accept="image/jpeg,image/png,image/jpg,image/webp" multiple class="visually-hidden-input">
    </section>

    <!-- 快捷免上传体验按钮 (解决手机端系统权限严苛限制) -->
    <div style="text-align: center;">
      <button class="btn btn-secondary" id="demoBtn" style="font-size: 12px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;">
        💡 点击这里：一键载入示例样张快速试玩
      </button>
    </div>

    <!-- 2. 状态提示 -->
    <div class="toast-bar" id="toastBar">请分别上传【灵感参考图】与【待修原图】</div>

    <!-- 3. 打样卷帘对比工作台 (1:1 像素级硬件 clip-path 对比，杜绝挤压变形) -->
    <section class="preview-section" id="previewSection" style="display: none;">
      <div class="split-viewport" id="splitViewport">
        <canvas id="canvasBefore" class="split-canvas"></canvas>
        <canvas id="canvasAfter" class="split-canvas"></canvas>
        <div class="split-divider" id="splitDivider">
          <div class="divider-handle"></div>
        </div>
        <div class="split-label after-label">调色后 (Styled)</div>
        <div class="split-label before-label">原片 (Before)</div>
      </div>

      <!-- 风格配方卡片 -->
      <div class="recipe-card" id="recipeCard">
        <div class="recipe-header">
          <span class="recipe-title">✨ 提取调色逻辑</span>
          <div class="palette-group" id="paletteGroup"></div>
        </div>
        <div class="tags-group" id="tagsGroup"></div>
      </div>

      <!-- 控制面板 -->
      <div class="control-panel">
        <div class="control-row">
          <div class="control-label">
            <span>调色强度</span>
            <span class="value-text" id="intensityText">100%</span>
          </div>
          <input type="range" id="intensitySlider" min="0" max="100" value="100" class="slider-control">
        </div>

        <div class="control-row toggle-row">
          <label class="switch-label">
            <span>🛡️ 智能保留自然肤色 (防止发青发灰)</span>
            <input type="checkbox" id="skinToggle" checked>
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <!-- 操作按钮栏 -->
      <div class="action-bar">
        <button class="btn btn-secondary" id="saveFilterBtn">⭐ 存为专属滤镜</button>
        <button class="btn btn-primary" id="batchExportBtn">🚀 保存调色照片 (<span id="batchCount">1</span>张)</button>
      </div>
    </section>

    <!-- 4. 保存与导出弹窗 (针对微信长按保存 + 浏览器下载双兼容) -->
    <div class="modal-backdrop" id="batchModal" style="display: none;">
      <div class="modal-dialog">
        <h3 id="modalTitle">调色成品图片</h3>
        <p class="modal-subtext" id="modalSubtext">
          👇 <strong style="color: #4ade80;">长按下方图片，点击【保存图片】存入手机相册！</strong>
        </p>

        <!-- 进度条 -->
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <div class="progress-info" id="progressInfo">正在生成中...</div>

        <!-- 高清成品图片展示流 (供长按保存到相册) -->
        <div class="batch-gallery" id="batchGallery"></div>

        <div class="modal-actions" style="margin-top: 14px;">
          <button class="btn btn-primary" id="finishBatchBtn" style="width: 100%;">关闭 / 继续修图</button>
        </div>
      </div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
